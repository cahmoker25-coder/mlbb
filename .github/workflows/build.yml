
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-project.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ekstrak proyek
        run: |
          mkdir app-src
          unzip -q android-project.zip -d app-src

      - name: Build kedua APK
        working-directory: app-src
        run: gradle --no-daemon assembleOwnerRelease assembleViewerRelease

      - name: Simpan APK aplikasi saya
        uses: actions/upload-artifact@v4
        with:
          name: APK-aplikasi-saya
          path: app-src/app/build/outputs/apk/owner/release/*.apk

      - name: Simpan APK viewer
        uses: actions/upload-artifact@v4
        with:
          name: APK-viewer
          path: app-src/app/build/outputs/apk/viewer/release/*.apk
