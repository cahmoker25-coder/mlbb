name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-project.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Ambil repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Setup Android SDK
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path tidak ditemukan"
            exit 1
          fi

          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT/cmdline-tools"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip

          rm -rf latest
          mv cmdline-tools latest

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" --licenses

          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # Ekstrak proyek Android
      - name: Ekstrak proyek
        run: |
          mkdir -p app-src
          unzip -q android-project.zip -d app-src

      # Build APK Owner dan Viewer
      - name: Build kedua APK
        working-directory: app-src
        run: |
          gradle --no-daemon assembleOwnerRelease assembleViewerRelease

      # Simpan APK Owner
      - name: Simpan APK aplikasi saya
        uses: actions/upload-artifact@v4
        with:
          name: APK-aplikasi-saya
          path: app-src/app/build/outputs/apk/owner/release/*.apk
          if-no-files-found: error

      # Simpan APK Viewer
      - name: Simpan APK Viewer
        uses: actions/upload-artifact@v4
        with:
          name: APK-viewer
          path: app-src/app/build/outputs/apk/viewer/release/*.apk
          if-no-files-found: error
